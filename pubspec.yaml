name: vershina_salon
description: Local-first salon management system for web, Android, iOS and Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.0.0
  shared_preferences: ^2.0.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0
  permission_handler: ^11.0.1
  local_auth: ^2.0.0
  flutter_local_notifications: ^17.2.3
  csv: ^6.0.0
  pdf: ^3.1.0
  printing: ^5.13.0
  excel: ^4.0.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  image_picker: ^1.0.0
  table_calendar: ^3.0.0
  fl_chart: ^0.68.0
  sqlite3_flutter_libs: ^0.5.4
  drift: ^2.18.1
  drift_flutter: ^0.2.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  collection: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.0.0
  drift_dev: ^2.18.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: LuxurySerif
      fonts:
        - asset: assets/fonts/LuxurySerif-Regular.ttf

